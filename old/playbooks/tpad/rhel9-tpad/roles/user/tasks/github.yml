- name: Create local git dirs
  ansible.builtin.file:
    path: "{{ item.dest | dirname }}"
    state: directory
    mode: '0755'
  loop: "{{ git_repos }}"
  tags: git_dirs


- name: Clone git repositories
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.branch }}"
    force: yes
    update: yes
    accept_hostkey: yes
    key_file: "{{ ansible_env.HOME }}/.ssh/id_rsa"
  loop: "{{ git_repos }}"
  register: git_clone_result
  # Handle the DNS "Name or service not known" error
  until: git_clone_result is succeeded
  retries: 5
  delay: 3
  tags: clone_repos
