- name: Restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  become: yes

- name: Connect to Wi-Fi (using nmcli CLI)
  ansible.builtin.command: nmcli dev wifi connect "{{ wifi_home_ssid }}" password "{{ wifi_home_password }}"
  register: wifi_up
  retries: 5
  delay: 3
  until: wifi_up.rc == 0


- name: Set static IP for Wi-Fi connection
  ansible.builtin.command: >
    nmcli con modify "{{ wifi_home_ssid }}"
    ipv4.method manual
    ipv4.addresses "{{ wifi_ip }}/24"
    ipv4.gateway 192.168.1.1
    ipv4.dns 192.168.1.2
    ipv4.ignore-auto-dns yes
    autoconnect yes
  become: yes

- name: Activate Wi-Fi connection
  ansible.builtin.command: nmcli conn up "{{ wifi_home_ssid }}"
  register: wifi_up
  retries: 5
  delay: 3
  until: wifi_up.rc == 0
