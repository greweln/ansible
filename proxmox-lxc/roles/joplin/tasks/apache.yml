---
- name: Create WebDAV directory
  file:
    path: /var/www/html
    state: directory
    owner: apache
    group: apache
    mode: '0775'

- name: Remove default Apache welcome page
  file:
    path: /etc/httpd/conf.d/welcome.conf
    state: absent
  notify: restart apache

- name: Deploy WebDAV configuration
  template:
    src: webdav.conf.j2
    dest: /etc/httpd/conf.d/webdav.conf
  notify: restart apache

- name: Create Apache lock directory
  file:
    path: /var/lock/apache2
    state: directory
    owner: apache
    group: apache
    mode: '0755'

- name: Start and enable Apache
  service:
    name: httpd
    state: started
    enabled: true
