---
- name: Enable High Availability repository
  ansible.builtin.command:
    cmd: >
      subscription-manager repos
      --enable=rhel-{{ ansible_distribution_major_version }}-for-{{ ansible_architecture }}-highavailability-rpms
  register: ha_repo
  changed_when: "'is enabled' in ha_repo.stdout or ha_repo.rc == 0"

- name: Install Pacemaker packages
  ansible.builtin.dnf:
    name:
      - pcs
      - pacemaker
      - fence-agents-virsh
    state: present

- name: Enable high-availability firewall service
  ansible.posix.firewalld:
    service: high-availability
    permanent: true
    immediate: true
    state: enabled

- name: Enable and start pcsd
  ansible.builtin.systemd:
    name: pcsd.service
    enabled: true
    state: started
