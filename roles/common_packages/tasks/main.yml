- name: Install EPEPL
  dnf:
    name: epel-release
    state: present

- name: Enable crb
  command: dnf config-manager --set-enabled crb

- name: Update all packages
  dnf:
    name: '*'
    state: latest
    update_cache: yes

- name: Install packages
  dnf:
    name: "{{ packages }}"
    state: present

- name: Deploy binaries
  copy:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
    mode: '0755'
  loop: "{{ binaries | dict2items }}"
  tags: deploy_binaries
    
