---

- name: Deploy sssd.conf configuration
  ansible.builtin.template:
    src: templates/sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: '0600'
  notify:
    - Restart SSSD
    - Restart Autofs

- name: Select base sssd authselect profile
  ansible.builtin.command:
    cmd: authselect select sssd --force
  register: authselect_result
  changed_when: "'Profile selected' in authselect_result.stdout or 'Changes applied' in authselect_result.stdout"


- name: Ensure SSSD and Autofs are enabled and running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - sssd
    - autofs
