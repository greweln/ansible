- name: Install EPEL repository
  dnf:
    name: epel-release
    state: present


- name: Install Remi repository RPM
  dnf:
    name: https://rpms.remirepo.net/enterprise/remi-release-9.rpm
    disable_gpg_check: True
    state: present


- name: Enable PHP module from Remi
  dnf:
    name: "@php:remi-{{ php_version }}"
    state: present

- name: Install PHP 8.2 and Baïkal dependencies
  dnf:
    name:
      - nginx
      - php
      - php-fpm
      - php-mysqlnd
      - php-xml
      - php-mbstring
      - php-cli
      - unzip
    state: present

- name: Get latest Baïkal release
  uri:
    url: https://api.github.com/repos/sabre-io/Baikal/releases/latest
    return_content: yes
    headers:
      Accept: "application/vnd.github+json"
  register: baikal_release

- name: Set Baïkal version
  set_fact:
    baikal_version: "{{ baikal_release.json.tag_name }}"

- name: Download Baïkal
  get_url:
    url: "https://github.com/sabre-io/Baikal/releases/download/{{ baikal_version }}/baikal-{{ baikal_version }}.zip"
    dest: /tmp/baikal.zip
    mode: '0644'

- name: Extract Baïkal
  unarchive:
    src: /tmp/baikal.zip
    dest: /var/www/
    remote_src: yes

- name: Move Baïkal to final directory
  shell: mv /var/www/Baikal-* {{ baikal_install_dir }}
  args:
    creates: "{{ baikal_install_dir }}"

- name: Remove temporary Baïkal archive
  file:
    path: /tmp/baikal.zip
    state: absent
  ignore_errors: yes

- name: Set permissions
  file:
    path: "{{ baikal_install_dir }}"
    owner: nginx
    group: nginx
    mode: '0775'
    recurse: yes

- name: Configure php-fpm to run as nginx
  lineinfile:
    path: /etc/php-fpm.d/www.conf
    regexp: '^user ='
    line: 'user = nginx'
  notify: restart php-fpm

- name: Configure php-fpm group
  lineinfile:
    path: /etc/php-fpm.d/www.conf
    regexp: '^group ='
    line: 'group = nginx'
  notify: restart php-fpm

- name: Ensure PHP session directory permissions
  file:
    path: /var/lib/php/session
    owner: nginx
    group: nginx
    mode: "0770"
    state: directory

- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: true

- name: Enable and start php-fpm
  service:
    name: php-fpm
    state: started
    enabled: true
