---

- name: Stop the cluster
  listen: restart cluster
  ansible.builtin.command:
    pcs cluster stop --all
  delegate_to: "{{ cluster_nodes[0] }}"
  run_once: true


- name: Start cluster
  listen: restart cluster
  ansible.builtin.command:
    pcs cluster start --all delegate_to: "{{ cluster_nodes[0] }}"
  run_once: true
