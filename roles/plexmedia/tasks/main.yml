---
- name: Ensure required packages are installed
  dnf:
    name:
      - curl
      - ca-certificates
    state: present

- name: Add Plex yum repo
  copy:
    dest: /etc/yum.repos.d/plex.repo
    mode: '0644'
    content: |
      [PlexTv]
      name=Plex.tv
      baseurl=https://repo.plex.tv/rpm/
      enabled=1
      gpgcheck=1
      repo_gpgcheck=1
      gpgkey=https://downloads.plex.tv/plex-keys/PlexSign.v2.key

- name: Clean DNF metadata
  command: dnf clean all
  changed_when: false

- name: Rebuild DNF cache
  command: dnf makecache -y
  changed_when: false

- name: Install Plex Media Server
  dnf:
    name: plexmediaserver
    state: present

- name: Ensure media directories exist
  file:
    path: "/srv/media/{{ item }}"
    state: directory
    owner: plex
    group: plex
    mode: '0755'
  loop:
    "{{ media_dirs }}"
    
- name: Enable and start Plex service
  systemd:
    name: plexmediaserver
    enabled: true
    state: started

