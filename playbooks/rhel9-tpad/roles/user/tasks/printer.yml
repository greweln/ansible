- name: Ensure /etc/cups exists
  ansible.builtin.file:
    path: /etc/cups
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Deploy cups client config
  ansible.builtin.copy:
    src: cups/client.conf
    dest: /etc/cups/client.conf
    owner: root
    group: lp
    mode: '0644'
  become: yes

- name: Set default printer for my user
  ansible.builtin.command: "lpoptions -d Home-Brother_DCP-1610W"
  changed_when: false
