- name: Install print & scan packages
  ansible.builtin.dnf:
    name:
      - cups
      - simple-scan
      - sane-backends
      - sane-backends-drivers-scanners
    state: present
  become: yes

- name: Enable and start CUPS
  ansible.builtin.service:
    name: cups
    state: started
    enabled: yes
  become: yes

- name: Copy the Brother scanner driver
  ansible.builtin.copy:
    src: /root/files/lab/packages/brscan4-0.4.11-1.x86_64.rpm
    dest: /tmp/brscan4-0.4.11-1.x86_64.rpm
    mode: '0644'
  become: yes

- name: Install the Brother scanner driver
  ansible.builtin.dnf:
    name: /tmp/brscan4-0.4.11-1.x86_64.rpm
    state: present
  become: yes

- name: Ensure the Brother backend is enabled in SANE
  ansible.builtin.lineinfile:
    path: /etc/sane.d/dll.conf
    line: brother4
    state: present
    create: yes
  become: yes

- name: Register the Brother DCP-1612W scanner
  ansible.builtin.command: >
    brsaneconfig4 -a
    name=Home-Brother
    model=DCP-1612W
    ip="{{ scanner_brother_ip }}"
  args:
    creates: /var/lib/sane/Home-Brother
  become: yes
